<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - SSC Mission 2026</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c0916">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --primary: #6d4aff;
            --primary-dark: #3f1f9e;
            --secondary: #ff6b9d;
            --accent: #00d4ff;
            --glass-bg: rgba(20, 16, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0ecf5;
            --text-secondary: #9b8bb5;
            --text-muted: #6b5b85;
            --shadow: 0 25px 50px rgba(0,0,0,0.6);
            --radius: 28px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: rgba(109, 74, 255, 0.3);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0c0916;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #2d1b4e, #0a0613 80%);
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: floatOrb 20s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: rgba(109, 74, 255, 0.15);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 157, 0.1);
            bottom: -50px;
            left: -50px;
            animation-delay: -7s;
        }

        .orb:nth-child(3) {
            width: 200px;
            height: 200px;
            background: rgba(0, 212, 255, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
        }

        /* Grid Pattern */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(109, 74, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(109, 74, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ===== GLASS CARD ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.02);
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 1rem;
            position: relative;
            z-index: 1;
        }

        .login-card {
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Glow Effect */
        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(109, 74, 255, 0.05), transparent 60%);
            pointer-events: none;
            animation: glowPulse 8s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* ===== LOGO ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .login-logo .icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #a98eff, #6d4aff, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a98eff, #6d4aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* ===== FORM ===== */
        .login-form {
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            transition: var(--transition);
            overflow: hidden;
        }

        .form-group .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--input-focus);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        .form-group .input-wrapper input {
            flex: 1;
            padding: 0.9rem 1rem 0.9rem 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }

        .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group .input-wrapper .toggle-password {
            padding: 0 1rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            border: none;
            font-size: 1rem;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: var(--text-primary);
        }

        /* ===== FORM OPTIONS ===== */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .form-options .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-options .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            border-radius: 4px;
        }

        .form-options .forgot-password {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
            font-weight: 500;
        }

        .form-options .forgot-password:hover {
            color: #a98eff;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            width: 100%;
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            font-weight: 600;
            padding: 1rem;
            border-radius: 16px;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 30px rgba(109, 74, 255, 0.2);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(109, 74, 255, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading .btn-text {
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--input-border);
        }

        /* ===== DEMO ACCOUNT ===== */
        .demo-account {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            border: 1px dashed var(--input-border);
        }

        .demo-account p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .demo-account .credentials {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .demo-account .credentials span {
            background: rgba(109, 74, 255, 0.1);
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            border: 1px solid rgba(109, 74, 255, 0.1);
        }

        .demo-account .credentials .username {
            color: #a98eff;
        }

        .demo-account .credentials .password {
            color: #f472b6;
        }

        /* ===== SIGNUP LINK ===== */
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .signup-link a:hover {
            color: #a98eff;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: #f87171;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 1.1rem;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            max-width: 350px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast .toast-icon {
            font-size: 1.5rem;
        }

        .toast .toast-icon.success { color: #34d399; }
        .toast .toast-icon.error { color: #f87171; }

        .toast .toast-content h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .toast .toast-content p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .login-logo h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                gap: 0.8rem;
                align-items: flex-start;
            }

            .demo-account .credentials {
                flex-direction: column;
                gap: 0.5rem;
            }

            .toast {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }

        @media (max-height: 700px) {
            .login-card {
                padding: 1.5rem;
            }

            .login-logo {
                margin-bottom: 1rem;
            }

            .login-logo .icon {
                font-size: 2rem;
            }

            .login-logo h1 {
                font-size: 1.3rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .form-group .input-wrapper input {
                padding: 0.7rem 1rem 0.7rem 0;
            }

            .btn-primary {
                padding: 0.8rem;
            }
        }

        /* ===== LOADING SHIMMER ===== */
        .shimmer {
            background: linear-gradient(90deg, var(--input-bg) 25%, rgba(255,255,255,0.05) 50%, var(--input-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- ===== TOAST NOTIFICATION ===== -->
    <div class="toast" id="toast">
        <div class="toast-icon success" id="toastIcon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="toast-content">
            <h4 id="toastTitle">Success!</h4>
            <p id="toastMessage">Welcome back!</p>
        </div>
    </div>

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">
        <div class="login-card glass" data-aos="fade-up" data-aos-duration="800">
            <!-- Logo -->
            <div class="login-logo">
                <div class="icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <h1>SSC Mission</h1>
                <p>Your journey to selection starts here</p>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid username or password</span>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user" style="margin-right: 6px;"></i> Username
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Enter your username" 
                            value="adarsh"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-right: 6px;"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password" 
                            value="123456"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">or continue with</div>

            <!-- Demo Account -->
            <div class="demo-account">
                <p><i class="fas fa-info-circle" style="color: var(--primary);"></i> Use demo account to explore</p>
                <div class="credentials">
                    <span class="username"><i class="fas fa-user"></i> adarsh</span>
                    <span class="password"><i class="fas fa-lock"></i> 123456</span>
                </div>
            </div>

            <!-- Signup Link -->
            <div class="signup-link">
                Don't have an account? <a href="#">Sign up free</a>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // ===== AOS INIT =====
        AOS.init({
            duration: 800,
            once: true,
            offset: 20,
            easing: 'ease-out-cubic'
        });

        // ===== DOM ELEMENTS =====
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const togglePassword = document.getElementById('togglePassword');
        const rememberMe = document.getElementById('rememberMe');
        const toast = document.getElementById('toast');

        // ===== TOGGLE PASSWORD =====
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // ===== SHOW TOAST =====
        function showToast(icon, title, message, type = 'success') {
            const toastIcon = document.getElementById('toastIcon');
            toastIcon.className = `toast-icon ${type}`;
            toastIcon.innerHTML = `<i class="fas ${icon}"></i>`;
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ===== SHOW ERROR =====
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 4000);
        }

        // ===== HIDE ERROR =====
        function hideError() {
            errorMessage.classList.remove('show');
        }

        // ===== LOGIN FUNCTION =====
        function handleLogin(e) {
            e.preventDefault();
            hideError();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Validation
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            if (username.length < 3) {
                showError('Username must be at least 3 characters');
                return;
            }

            if (password.length < 3) {
                showError('Password must be at least 3 characters');
                return;
            }

            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.querySelector('.btn-text').innerHTML = 'Signing in...';

            // Simulate API call
            setTimeout(() => {
                // Check credentials (demo: adarsh/123456)
                if (username === 'adarsh' && password === '123456') {
                    // Success
                    loginBtn.classList.remove('loading');
                    loginBtn.querySelector('.btn-text').innerHTML = '<i class="fas fa-check-circle"></i> Welcome!';
                    
                    // Save to localStorage
                    const userData = {
                        username: username,
                        loggedIn: true,
                        loginTime: new Date().toISOString(),
                        rememberMe: rememberMe.checked
                    };
                    localStorage.setItem('sscUser', JSON.stringify(userData));
                    
                    // Show success toast
                    showToast(
                        'fa-check-circle',
                        'Welcome back, ' + username + '! 🎉',
                        'Redirecting to dashboard...',
                        'success'
                    );

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);

                } else {
                    // Error
                    loginBtn.classList.remove('loading');
                    loginBtn.querySelector('.btn-text').innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    showError('Invalid username or password. Try: adarsh / 123456');
                    
                    // Shake animation
                    document.querySelector('.login-card').style.animation = 'shake 0.5s ease';
                    setTimeout(() => {
                        document.querySelector('.login-card').style.animation = '';
                    }, 500);
                }
            }, 1200);
        }

        // ===== ADD SHAKE ANIMATION =====
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
                20%, 40%, 60%, 80% { transform: translateX(8px); }
            }
        `;
        document.head.appendChild(style);

        // ===== FORM SUBMIT =====
        form.addEventListener('submit', handleLogin);

        // ===== ENTER KEY SUPPORT =====
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        // ===== CHECK SAVED SESSION =====
        (function checkSession() {
            const saved = localStorage.getItem('sscUser');
            if (saved) {
                try {
                    const userData = JSON.parse(saved);
                    if (userData.loggedIn && userData.rememberMe) {
                        usernameInput.value = userData.username;
                        rememberMe.checked = true;
                        // Auto login
                        setTimeout(() => {
                            form.dispatchEvent(new Event('submit'));
                        }, 500);
                    }
                } catch (e) {
